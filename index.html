
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velora Markit - الطلب</title>
<style>
body{font-family:Arial,sans-serif;background:#faf7f5;color:#222;margin:0;padding:16px}
main{max-width:500px;margin:auto;background:white;padding:20px;border-radius:18px}
h1{text-align:center}
.price{font-size:28px;font-weight:bold;text-align:center}
label{display:block;margin-top:14px}
input,select,button{width:100%;padding:14px;margin-top:6px;box-sizing:border-box;border-radius:10px;font-size:16px}
input,select{border:1px solid #ccc}
button{background:#159447;color:white;border:0;font-weight:bold;margin-top:20px}
.note{color:#666;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<main>
<h1>Velora Markit</h1>
<h2>حقيبة نسائية أنيقة</h2>
<p class="price">279 درهم</p>
<p>الدفع عند الاستلام</p>

<form id="orderForm">
<label>الاسم الكامل</label>
<input id="name" required placeholder="الاسم الكامل">

<label>رقم الهاتف</label>
<input id="phone" type="tel" required placeholder="06XXXXXXXX">

<label>المدينة والعنوان</label>
<input id="address" required placeholder="المدينة والحي والعنوان">

<label>اختاري اللون</label>
<select id="color">
<option>أسود</option>
<option>بيج</option>
<option>بني</option>
</select>

<button type="submit">تأكيد الطلب عبر واتساب</button>
</form>

<p class="note">من بعد الضغط، غادي يتحل واتساب برسالة فيها معلومات الطلب. وسيتم إرسال محاولة لتسجيل الطلب في جدول البيانات.</p>
<p id="status" class="note"></p>
</main>

<script>
const WHATSAPP_NUMBER = "212764885273";
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFiRVrM8rCLs6JYUOpnUvOb3apleLS8Wj_g-uuhG4066jNabljOiMuGyxbtiB-wAdm/exec";

document.getElementById("orderForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const order = {
    name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    address: document.getElementById("address").value.trim(),
    product: "حقيبة نسائية أنيقة",
    color: document.getElementById("color").value,
    price: 279,
    timestamp: new Date().toISOString()
  };

  const message =
    "السلام عليكم، بغيت نأكد الطلب:\n" +
    "الاسم: " + order.name + "\n" +
    "الهاتف: " + order.phone + "\n" +
    "العنوان: " + order.address + "\n" +
    "المنتج: " + order.product + "\n" +
    "اللون: " + order.color + "\n" +
    "الثمن: 279 درهم";

  window.open(
    "https://wa.me/" + WHATSAPP_NUMBER +
    "?text=" + encodeURIComponent(message),
    "_blank"
  );

  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(order)
  }).then(function() {
    document.getElementById("status").textContent =
      "تمت محاولة إرسال الطلب. خاصنا نتأكدو واش تزاد فجدول البيانات.";
  }).catch(function() {
    document.getElementById("status").textContent =
      "ما قدرناش نرسلو الطلب لجدول البيانات. تواصل عبر واتساب.";
  });
});
</script>
</body>
</html>
