.hero{padding:18px}

.section{padding:0 18px 20px}
.card{background:#f8fafb;border-radius:16px;padding:18px}
label{display:block;font-weight:700;margin:12px 0 6px}
input{width:100%;padding:14px;border:1px solid #d9dfe4;border-radius:10px;font-size:16px}
button{width:100%;border:0;background:#168044;color:#fff;padding:16px;border-radius:12px;font-size:18px;font-weight:800;margin-top:16px}
